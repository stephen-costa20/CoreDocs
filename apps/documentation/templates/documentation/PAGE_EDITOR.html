<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Editor</title>
    <!-- Load Tailwind CSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Simple focus states for accessibility */
        button:focus-visible, a:focus-visible, select:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
            border-radius: 6px;
        }
        /* Custom style for the contenteditable area */
        .editor-content:focus {
            outline: none;
        }
        /* Style for the drag-over state on the drop zone */
        .drop-zone.dragging {
            background-color: #f0f9ff; /* bg-blue-50 */
            border-color: #3b82f6; /* border-blue-500 */
        }
        
        /* --- ADDED: Custom Select Styling --- */
        .custom-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            /* Add padding to make room for the arrow */
            padding-right: 2.25rem !important; /* 36px */
            /* Add custom arrow */
            background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.25 4.25a.75.75 0 01-1.06 0L5.23 8.29a.75.75 0 01.02-1.06z" clip-rule="evenodd" /></svg>');
            background-repeat: no-repeat;
            background-position: right 0.5rem center; /* 8px */
            background-size: 1.25em 1.25em; /* 20px */
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="bg-white min-h-screen">
        <!-- Main content area -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Layout grid: 2/3 for content, 1/3 for sidebar on large screens -->
            <div class="lg:grid lg:grid-cols-3 lg:gap-8">

                <!-- Left Column: Main Content Editor -->
                <main class="lg:col-span-2">

                    <!-- Featured Excerpt Section -->
                    <section class="mt-8">
                        <!-- WYSIWYG Toolbar -->
                        <div id="toolbar" class="border border-gray-200 rounded-t-lg bg-gray-50 p-2 flex flex-wrap items-center gap-2">
                            
                            <!-- Format Select -->
                            <select data-command="formatBlock" class="custom-select text-sm text-gray-700 bg-white border border-gray-300 rounded-lg px-3 py-1.5 hover:bg-gray-100 focus:outline-none">
                                <option value="p">Paragraph</option>
                                <option value="h1">Heading 1</option>
                                <option value="h2">Heading 2</option>
                                <option value="h3">Heading 3</option>
                            </select>
                            
                            <!-- Font Select -->
                            <select data-command="fontName" class="custom-select text-sm text-gray-700 bg-white border border-gray-300 rounded-lg px-3 py-1.5 hover:bg-gray-100 focus:outline-none">
                                <option value="Inter">Inter</option>
                                <option value="Arial">Arial</option>
                                <option value="Georgia">Georgia</option>
                                <option value="Times New Roman">Times New Roman</option>
                                <option value="Verdana">Verdana</option>
                            </select>
                            
                            <!-- Size Select -->
                            <select id="fontSizeSelect" class="custom-select text-sm text-gray-700 bg-white border border-gray-300 rounded-lg px-3 py-1.5 hover:bg-gray-100 focus:outline-none">
                                <option value="5">5</option>
                                <option value="5.5">5.5</option>
                                <option value="6.5">6.5</option>
                                <option value="7.5">7.5</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="10.5">10.5</option>
                                <option value="11">11</option>
                                <option value="12" selected>12</option>
                                <option value="14">14</option>
                                <option value="16">16</option>
                                <option value="18">18</option>
                                <option value="20">20</option>
                                <option value="22">22</option>
                                <option value="24">24</option>
                                <option value="26">26</option>
                                <option value="28">28</option>
                                <option value="36">36</option>
                                <option value="48">48</option>
                                <option value="72">72</option>
                            </select>
                            
                            <!-- Formatting Buttons -->
                            <div class="flex items-center space-x-0.5 pl-1">
                                <button data-command="bold" class="p-2 rounded-md hover:bg-gray-200 text-gray-700 w-9 h-9 flex items-center justify-center">
                                    <span class="font-bold text-base">B</span>
                                    <span class="sr-only">Bold</span>
                                </button>
                                <button data-command="italic" class="p-2 rounded-md hover:bg-gray-200 text-gray-700 w-9 h-9 flex items-center justify-center">
                                    <span class="italic text-base">I</span>
                                    <span class="sr-only">Italic</span>
                                </button>
                                <button data-command="underline" class="p-2 rounded-md hover:bg-gray-200 text-gray-700 w-9 h-9 flex items-center justify-center">
                                    <span class="underline text-base">U</span>
                                    <span class="sr-only">Underline</span>
                                </button>
                            </div>
                        
                            <!-- Separator -->
                            <div class="h-5 w-px bg-gray-300 mx-2"></div>

                            <!-- List/Link Buttons -->
                            <div class="flex items-center space-x-0.5">
                                <button data-command="insertUnorderedList" class="p-2 rounded-md hover:bg-gray-200 text-gray-600">
                                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12M8.25 17.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>
                                    <span class="sr-only">Bulleted List</span>
                                </button>
                                <button data-command="createLink" class="p-2 rounded-md hover:bg-gray-200 text-gray-600">
                                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" /></svg>
                                    <span class="sr-only">Link</span>
                                </button>
                            </div>
                        
                            <!-- Separator -->
                            <div class="h-5 w-px bg-gray-300 mx-2"></div>
                        
                            <!-- Image/Magic Buttons -->
                            <div class="flex items-center space-x-0.5">
                                <button id="imageButton" class="p-2 rounded-md hover:bg-gray-200 text-gray-600">
                                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.007v.008h-.007V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>
                                    <span class="sr-only">Image</span>
                                </button>
                                <!-- REMOVED Magic Button -->
                            </div>

                        </div>
                        
                        <!-- Text Area -->
                        <div id="editor" class="editor-content prose prose-lg max-w-none border border-gray-200 rounded-b-lg p-6 h-[500px] overflow-y-auto focus:outline-none" contenteditable="true">
                            <p>Text goes here</p>
                        </div>
                    </section>

                </main>
            </div>
        </div>
    </div>

    <!-- Image Upload Modal -->
    <div id="imageModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg">
            <!-- Modal Header -->
            <div class="flex justify-between items-center p-4 border-b">
                <h3 class="text-lg font-medium text-gray-900">Upload Image</h3>
                <button id="closeModal" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <!-- Modal Body -->
            <div class="p-6">
                <!-- Hidden file input -->
                <input type="file" id="fileInput" class="hidden" accept="image/*" />
                
                <!-- Drop Zone -->
                <div id="dropZone" class="drop-zone border-2 border-dashed border-gray-300 rounded-lg p-12 text-center cursor-pointer transition-colors duration-200 ease-in-out hover:border-blue-500 hover:bg-blue-50">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="mt-2 text-sm text-gray-600">
                        <span class="font-medium text-blue-600">Click to upload</span> or drag and drop
                    </p>
                    <p class="mt-1 text-xs text-gray-500">PNG, JPG, GIF up to 10MB</p>
                </div>
            </div>
            <!-- Modal Footer -->
            <div class="p-4 bg-gray-50 border-t rounded-b-lg text-right">
                <button id="cancelUpload" class="px-4 py-2 bg-white border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const editor = document.getElementById('editor');
            const toolbar = document.getElementById('toolbar');
            
            // --- Toolbar Button Logic ---
            toolbar.addEventListener('mousedown', (e) => {
                const target = e.target.closest('button');
                if (!target) return; // Only act on buttons

                e.preventDefault(); // Prevent editor losing focus ONLY for buttons

                // Handle buttons on mousedown
                const command = target.dataset.command;
                if (command === 'createLink') {
                    const value = prompt('Enter the URL:');
                    if (!value) return; // User cancelled
                    document.execCommand(command, false, value);
                } else if (command) {
                    document.execCommand(command, false, null);
                }
            });

            // --- Handle select changes for Format and Font Name ---
            toolbar.addEventListener('change', (e) => {
                const target = e.target.closest('select');
                if (!target) return;

                const command = target.dataset.command;
                if (command) { // This will now only catch 'formatBlock' and 'fontName'
                    const value = target.value;
                    document.execCommand(command, false, value);
                    editor.focus(); // Refocus the editor
                }
            });

            // --- ADDED: Handle Font Size Select Separately ---
            const fontSizeSelect = document.getElementById('fontSizeSelect');
            fontSizeSelect.addEventListener('change', (e) => {
                const size = e.target.value + 'px'; // e.g., "12px"
                
                editor.focus(); // Ensure editor has focus to get selection
                
                const selection = window.getSelection();
                if (!selection.rangeCount || selection.isCollapsed) {
                    // If no selection, don't do anything (or we could insert a span for future typing)
                    return; 
                }
                
                const range = selection.getRangeAt(0);
                const span = document.createElement('span');
                span.style.fontSize = size;
                
                try {
                    // This is the standard way to wrap selected content
                    range.surroundContents(span);
                } catch (ex) {
                    // This can fail if the selection spans across block elements
                    // As a fallback, we can try to apply it differently, but for most cases this is fine.
                    console.error("Could not apply font size. Selection might be too complex.", ex);
                    // Fallback: This is less ideal but can work
                    document.execCommand('styleWithCSS', true, null);
                    document.execCommand('fontSize', false, "1"); // Use a dummy value
                    // Find the <font> tag just created and replace it
                    const parent = range.commonAncestorContainer.parentElement;
                    const fontTag = parent.querySelector('font[size="1"]');
                    if(fontTag) {
                        fontTag.removeAttribute('size');
                        fontTag.style.fontSize = size;
                    }
                } finally {
                    // Clean up selection
                    selection.removeAllRanges();
                }
            });


            // --- Image Modal Logic ---
            const imageModal = document.getElementById('imageModal');
            const imageButton = document.getElementById('imageButton');
            const closeModal = document.getElementById('closeModal');
            const cancelUpload = document.getElementById('cancelUpload');
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');

            // Show modal
            imageButton.addEventListener('click', () => {
                imageModal.classList.remove('hidden');
            });

            // Hide modal
            const hideModal = () => {
                imageModal.classList.add('hidden');
                dropZone.classList.remove('dragging');
            };
            closeModal.addEventListener('click', hideModal);
            cancelUpload.addEventListener('click', hideModal);
            imageModal.addEventListener('click', (e) => {
                // Hide if clicked on the backdrop
                if (e.target === imageModal) {
                    hideModal();
                }
            });

            // --- Image Upload Logic ---

            // 1. Click to upload
            dropZone.addEventListener('click', () => {
                fileInput.click();
            });

            // 2. File input change
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    handleFile(e.target.files[0]);
                }
            });

            // 3. Drag and Drop
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragging');
            });
            dropZone.addEventListener('dragenter', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragging');
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragging');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragging');
                if (e.dataTransfer.files.length) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            // 4. Handle the file (read and insert)
            function handleFile(file) {
                if (!file.type.startsWith('image/')) {
                    console.log('File is not an image.');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    const dataUrl = e.target.result;
                    // Restore focus to editor before inserting
                    editor.focus();
                    // Insert the image
                    document.execCommand('insertImage', false, dataUrl);
                    // Hide the modal
                    hideModal();
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
